services:
  - type: web
    name: ecoguard-api
    runtime: docker
    rootDir: EcoGuard
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: FLASK_DEBUG
        value: "false"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "4"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GEE_PROJECT_ID
        value: n8n-gmail-project-504217
      - key: GEE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: LLM_BASE_URL
        value: https://tokenharbor.ai/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_PRIMARY_MODEL
        value: deepseek-v4.1-flash-1017
      - key: LLM_FALLBACK_MODEL
        value: deepseek-v4.1-flash:free
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: ALERT_EMAIL
        sync: false
